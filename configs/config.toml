# Configurations for the adaptive recovery protocol
# PARAMETERS
# n_qubits: Number of qubits in the system (default: 1)
# beta: Inverse temperature for the reference state (default: 2.0)
# gamma: Coupling strength (default: 1.0)
# dt: Time step for the evolution (default: 0.1)
# n_timesteps: Number of time steps to evolve (default: 10)
# n_states: Number of different initial states to test (default: 5)
# recovery_type: Type of recovery experiment (default: "auto"):
#   - "random": Use random initial states for each run
#   - "fixed-random": Use a random fixed initial state for all runs
#   - "auto": Use the reference state itself as initial state
# seed: Random seed for reproducibility (default: 42)

n_qubits        = 1
beta            = 2.0
gamma           = 1.0
dt              = 0.1
n_timesteps     = 10
n_states        = 5
recovery_type   = "random"
seed            = 42